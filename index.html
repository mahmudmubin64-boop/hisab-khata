<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2447c4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="হিসাব">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>হিসাবের খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla&display=swap">
<style>
/* layout: a khata book. Balance and entry form sit in a sticky left column, the accounts (ruled paper, money column on the right) fill the rest; one column on phones */
:root {
  color-scheme: light;
  --bg: #f4f6fb;
  --card: #ffffff;
  --ink: #18264a;
  --muted: #5b6985;
  --line: #d8dfec;
  --rule: rgba(36, 71, 196, 0.07);
  --accent: #2447c4;
  --accent-ink: #ffffff;
  --spend: #b3261e;
  --income: #1b7a4b;
  --margin: #d9534f;
  --soft: #e8edf9;
  --bar: #9fb2ee;
  --display: 'Tiro Bangla', 'Noto Serif Bengali', serif;
  --body: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1526; --card: #162038; --ink: #e8edfa; --muted: #9aa7c4; --line: #2a3555;
    --rule: rgba(127, 156, 255, 0.06); --accent: #8aa4ff; --accent-ink: #0e1526;
    --spend: #ff8f86; --income: #6dd7a1; --margin: #e5736e; --soft: #1d2848; --bar: #4a63b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1526; --card: #162038; --ink: #e8edfa; --muted: #9aa7c4; --line: #2a3555;
  --rule: rgba(127, 156, 255, 0.06); --accent: #8aa4ff; --accent-ink: #0e1526;
  --spend: #ff8f86; --income: #6dd7a1; --margin: #e5736e; --soft: #1d2848; --bar: #4a63b8;
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: linear-gradient(var(--rule) 1px, transparent 1px);
  background-size: 100% 30px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  padding-inline: 16px;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 400; text-wrap: balance; }

.wrap { max-width: 1040px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 2rem; line-height: 1.2; }
.sub { color: var(--muted); font-size: 0.95rem; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; color: var(--muted); }
.ghost:hover { border-color: var(--accent); color: var(--ink); }

.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.side, .main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
@media (min-width: 900px) {
  .layout { grid-template-columns: 360px minmax(0, 1fr); align-items: start; }
  .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
}

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card > h2 { font-size: 1.25rem; margin-bottom: 12px; }
.note { color: var(--muted); font-size: 0.9rem; }

/* balance, written like a subtotal in a khata */
.hero { border-top: 3px double var(--margin); }
.hl { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 4px; }
.hl span { color: var(--muted); }
.hl b { font-family: var(--display); font-weight: 400; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.hl.total { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--ink); }
.hl.total span { color: var(--ink); font-weight: 600; }
.hl.total b { font-size: 2rem; line-height: 1.2; }
.inc { color: var(--income); }
.exp { color: var(--spend); }
.hero .hint { margin-top: 8px; }

/* entry form */
form .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
.seg button { border: 0; background: transparent; padding: 9px 8px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label, .lbl { font-size: 0.9rem; color: var(--muted); }
.field input { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; font-size: 16px; }
.field input:focus { border-color: var(--accent); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.money { position: relative; }
.money i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); pointer-events: none; }
.money input { padding-left: 28px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: 0.9rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--ink); }
.submit { width: 100%; border: 0; border-radius: 8px; padding: 11px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 1.05rem; }
form[data-type="income"] .submit { background: var(--income); }
.submit:hover { filter: brightness(1.08); }
.err { color: var(--spend); font-size: 0.9rem; min-height: 1.4em; margin-bottom: 4px; }

/* summary strip */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.stat { padding: 14px 12px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .k { color: var(--muted); font-size: 0.85rem; }
.stat .v { font-family: var(--display); font-size: clamp(1.05rem, 4.8vw, 1.6rem); line-height: 1.3; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .s { color: var(--muted); font-size: 0.8rem; }

/* averages */
.avg { display: flex; flex-direction: column; margin: 0; }
.avg > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 9px; border-bottom: 1px dashed var(--line); }
.avg > div:last-child { border-bottom: 0; }
.avg dt { min-width: 0; }
.avg dt small { display: block; color: var(--muted); font-size: 0.8rem; }
.avg dd { margin: 0; font-family: var(--display); font-size: 1.2rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* budget */
.bar { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; margin-block: 10px 8px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar.over > i { background: var(--spend); }
.brow { display: flex; gap: 8px; margin-top: 12px; }
.brow .money { flex: 1; min-width: 0; }
.brow input { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px 8px 28px; width: 100%; min-width: 0; font-size: 16px; }
.brow button { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 8px; padding: 8px 14px; font-weight: 500; }

/* chart + categories */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--body); }
.chart .tt { fill: var(--ink); font-weight: 600; }
.legend { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
.legend svg { flex: none; }
.cats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.cats li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; }
.cats .track { grid-column: 1 / -1; height: 8px; background: var(--soft); border-radius: 999px; overflow: hidden; }
.cats .track i { display: block; height: 100%; background: var(--accent); }
.cats b { font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ledger */
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); white-space: nowrap; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--margin); }
.grp { margin-bottom: 14px; }
.gh { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--ink); }
.gh b { font-family: var(--display); font-weight: 400; }
.gh span { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; border-bottom: 1px solid var(--line); }
.what { padding: 8px 10px 8px 0; min-width: 0; overflow-wrap: anywhere; }
.tag { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 0.78rem; vertical-align: 1px; }
.amt { align-self: stretch; display: flex; align-items: center; justify-content: flex-end; min-width: 92px; padding: 8px 0 8px 12px; border-left: 1px solid var(--margin); font-variant-numeric: tabular-nums; white-space: nowrap; }
.x { border: 0; background: transparent; color: var(--muted); padding: 4px 8px; font-size: 1.1rem; line-height: 1; border-radius: 6px; }
.x:hover { color: var(--spend); }
.ask { grid-column: 1 / -1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 0 8px; font-size: 0.9rem; }
.ask button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 12px; }
.ask .yes { border-color: var(--spend); color: var(--spend); }
.wk { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.wk .t { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.wk .t b { font-family: var(--display); font-weight: 400; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.wk .m { color: var(--muted); font-size: 0.85rem; }
.wk .track { height: 6px; background: var(--soft); border-radius: 999px; overflow: hidden; }
.wk .track i { display: block; height: 100%; background: var(--bar); }
.wk.now .track i { background: var(--accent); }
.more { margin-top: 10px; }
.empty { padding: 20px 4px; color: var(--muted); }
.empty b { color: var(--ink); font-weight: 600; }

.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.filebtn { cursor: pointer; display: inline-block; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 0.95rem; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 5; }
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>হিসাবের খাতা</h1>
      <p class="sub" id="todayLabel"></p>
    </div>
    <button class="ghost" id="exportBtn" type="button" hidden>CSV হিসেবে নামান</button>
  </header>

  <div class="layout">
    <aside class="side">
      <section class="card hero" id="hero" aria-label="স্থিতি"></section>

      <form class="card" id="entryForm" data-type="expense" autocomplete="off" novalidate>
        <div class="seg" role="group" aria-label="ধরন">
          <button type="button" id="tExp" aria-pressed="true">খরচ করেছি</button>
          <button type="button" id="tInc" aria-pressed="false">টাকা পেয়েছি</button>
        </div>
        <div class="field">
          <label for="fName" id="nameLbl">কিসের খরচ</label>
          <input id="fName" list="names" maxlength="80" placeholder="যেমন: দুপুরের ভাত, রিকশা ভাড়া">
          <datalist id="names"></datalist>
        </div>
        <div class="two">
          <div class="field">
            <label for="fAmount">টাকার পরিমাণ</label>
            <div class="money"><i>৳</i><input id="fAmount" inputmode="decimal" placeholder="০"></div>
          </div>
          <div class="field">
            <label for="fDate">তারিখ</label>
            <input id="fDate" type="date">
          </div>
        </div>
        <p class="err" id="fErr" role="alert"></p>
        <button class="submit" type="submit">খাতায় লিখুন</button>
      </form>
    </aside>

    <main class="main">
      <section class="stats" id="stats" aria-label="সারসংক্ষেপ"></section>

      <section class="card" aria-labelledby="avgH">
        <h2 id="avgH">গড় হিসাব</h2>
        <dl class="avg" id="avg"></dl>
      </section>

      <section class="card" aria-labelledby="budH">
        <h2 id="budH">এই মাসের বাজেট</h2>
        <div id="bInfo"></div>
        <form class="brow" id="bForm" autocomplete="off">
          <div class="money"><i>৳</i><input id="bInput" inputmode="decimal" placeholder="মাসে কত খরচ করতে চান" aria-label="মাসিক বাজেট"></div>
          <button type="submit">ঠিক করুন</button>
        </form>
      </section>

      <section class="card" aria-labelledby="chH">
        <h2 id="chH">শেষ ১৪ দিনের খরচ</h2>
        <div class="legend" id="chLegend"></div>
        <div id="chart"></div>
      </section>

      <section class="card" aria-labelledby="bookH">
        <h2 id="bookH">খাতা</h2>
        <div class="tabs" role="tablist" id="tabs">
          <button class="tab" role="tab" data-tab="daily" aria-selected="true">দৈনিক</button>
          <button class="tab" role="tab" data-tab="weekly" aria-selected="false">সাপ্তাহিক</button>
          <button class="tab" role="tab" data-tab="monthly" aria-selected="false">মাসিক</button>
          <button class="tab" role="tab" data-tab="income" aria-selected="false">টাকা পাওয়া</button>
        </div>
        <div id="book" role="tabpanel"></div>
      </section>
      <section class="card" aria-labelledby="bkH">
        <h2 id="bkH">ব্যাকআপ</h2>
        <p class="note" id="bkNote"></p>
        <div class="acts">
          <button class="ghost" id="bkBtn" type="button">ব্যাকআপ নামান</button>
          <label class="ghost filebtn" for="bkFile">ব্যাকআপ ঢুকান</label>
          <input id="bkFile" type="file" accept=".json,application/json" hidden>
        </div>
      </section>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  /* ---------- numbers and dates (Bangla digits, Saturday-start weeks) ---------- */
  var nf = new Intl.NumberFormat('bn-BD', { maximumFractionDigits: 0 });
  var tk = function (n) { return '৳' + nf.format(Math.round(n)); };
  var bn = function (n) { return nf.format(n); };
  var BND = '০১২৩৪৫৬৭৮৯';
  var toEn = function (s) { return String(s).replace(/[০-৯]/g, function (d) { return BND.indexOf(d); }).replace(/[,،\s৳]/g, ''); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parse = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var addDays = function (d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
  var weekStart = function (d) { return addDays(d, -((d.getDay() + 1) % 7)); };
  var DAY = 864e5;
  var fFull = new Intl.DateTimeFormat('bn-BD', { weekday: 'long', day: 'numeric', month: 'long' });
  var fShort = new Intl.DateTimeFormat('bn-BD', { day: 'numeric', month: 'short' });
  var fMonth = new Intl.DateTimeFormat('bn-BD', { month: 'long', year: 'numeric' });
  var fMonthOnly = new Intl.DateTimeFormat('bn-BD', { month: 'long' });

  var state = { entries: [], budget: 0, loaded: false, mode: '', tab: 'daily', type: 'expense', confirm: '', dailyShow: 20, weeklyShow: 12, monthlyShow: 12 };

  /* ---------- calculations ---------- */
  function compute() {
    var now = new Date();
    var today = ymd(now);
    var ex = state.entries.filter(function (e) { return e.type === 'expense'; });
    var inc = state.entries.filter(function (e) { return e.type === 'income'; });
    var sum = function (a) { return a.reduce(function (s, e) { return s + e.amount; }, 0); };
    var byDay = {}, byWeek = {}, byMonth = {}, incMonth = {};
    ex.forEach(function (e) {
      byDay[e.date] = (byDay[e.date] || 0) + e.amount;
      var wk = ymd(weekStart(parse(e.date)));
      byWeek[wk] = (byWeek[wk] || 0) + e.amount;
      var m = e.date.slice(0, 7);
      byMonth[m] = (byMonth[m] || 0) + e.amount;
    });
    inc.forEach(function (e) { var m = e.date.slice(0, 7); incMonth[m] = (incMonth[m] || 0) + e.amount; });

    var curWk = ymd(weekStart(now));
    var curMonth = today.slice(0, 7);
    var dom = now.getDate();
    var dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    var monthSum = byMonth[curMonth] || 0;
    var first = ex.length ? ex.reduce(function (m, e) { return e.date < m ? e.date : m; }, ex[0].date) : null;
    var avgDays = (first && first.slice(0, 7) === curMonth) ? dom - parse(first).getDate() + 1 : dom;
    var c = {
      now: now, today: today, ex: ex, inc: inc, byDay: byDay, byWeek: byWeek, byMonth: byMonth, incMonth: incMonth,
      curWk: curWk, curMonth: curMonth, dom: dom, dim: dim, first: first,
      totalExp: sum(ex), totalInc: sum(inc),
      todaySum: byDay[today] || 0, weekSum: byWeek[curWk] || 0, monthSum: monthSum,
      avgDays: avgDays, dailyAvg: monthSum / avgDays, projection: (monthSum / avgDays) * dim
    };

    c.weekAvg = null; c.weekNote = ''; c.monthAvg = null; c.monthNote = '';
    if (first) {
      var spanDays = Math.round((parse(today) - parse(first)) / DAY) + 1;
      var fw = weekStart(parse(first));
      var weeksDone = Math.round((weekStart(now) - fw) / (7 * DAY));
      if (weeksDone >= 1) {
        var s1 = 0; Object.keys(byWeek).forEach(function (k) { if (k < curWk) s1 += byWeek[k]; });
        c.weekAvg = s1 / weeksDone; c.weekNote = bn(weeksDone) + ' টি পূর্ণ সপ্তাহের গড়';
      } else {
        c.weekAvg = (c.totalExp / spanDays) * 7; c.weekNote = 'এখনো পূর্ণ সপ্তাহ হয়নি, দিনের হার থেকে হিসাব';
      }
      var fm = parse(first).getFullYear() * 12 + parse(first).getMonth();
      var cm = now.getFullYear() * 12 + now.getMonth();
      var monthsDone = cm - fm;
      if (monthsDone >= 1) {
        var s2 = 0; Object.keys(byMonth).forEach(function (k) { if (k < curMonth) s2 += byMonth[k]; });
        c.monthAvg = s2 / monthsDone; c.monthNote = bn(monthsDone) + ' টি পূর্ণ মাসের গড়';
      } else {
        c.monthAvg = c.projection; c.monthNote = 'এখনো পূর্ণ মাস হয়নি, এই মাসের হার থেকে হিসাব';
      }
    }
    return c;
  }

  /* ---------- render ---------- */
  function renderHero(c) {
    var el = $('hero');
    if (!state.loaded) { el.innerHTML = '<p class="note">খাতা খুলছি…</p>'; return; }
    var bal = c.totalInc - c.totalExp;
    el.innerHTML =
      '<div class="hl"><span>মোট পাওয়া</span><b class="inc">' + tk(c.totalInc) + '</b></div>' +

    var W = 360, H = 170, pl = 6, pr = 6, pt = 24, pb = 24, n = days.length, slot = (W - pl - pr) / n, bw = Math.min(16, slot * 0.62);

    });

    s += lab(maxIdx, max);

    var ay = yy(avg);

    s += '</svg>';

    a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 5000);
  }
  function saveFile(name, data, type) {
    var file = new File([data], name, { type: type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: name }).catch(function (e) { if (!e || e.name !== 'AbortError') anchorSave(file); });
    }
    anchorSave(file);
    return Promise.resolve();
  }

  $('exportBtn').addEventListener('click', function () {
    var rows = [['তারিখ', 'ধরন', 'বিবরণ', 'টাকা']];
    state.entries.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts || 0) - (b.ts || 0); }).forEach(function (e) {
      rows.push([e.date, e.type === 'income' ? 'পাওয়া' : 'খরচ', e.name, e.amount]);
    });
    var csv = '\ufeff' + rows.map(function (r) { return r.map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
    saveFile('hisab-khata-' + ymd(new Date()) + '.csv', csv, 'text/csv').catch(function () { toast('ফাইল নামানো যায়নি'); });
  });

  $('bkBtn').addEventListener('click', function () {
    var data = JSON.stringify({ app: 'hisab-khata', version: 1, exported: new Date().toISOString(), budget: state.budget, entries: state.entries });
    saveFile('hisab-khata-backup-' + ymd(new Date()) + '.json', data, 'application/json').then(function () {
      try { localStorage.setItem(LSB, ymd(new Date())); } catch (e) {}
      renderBackupNote();
    }).catch(function () { toast('ব্যাকআপ নামানো যায়নি'); });
  });

  $('bkFile').addEventListener('change', function () {
    var input = this, f = input.files && input.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var o = JSON.parse(String(rd.result));
        if (!o || o.app !== 'hisab-khata' || !Array.isArray(o.entries)) throw new Error('bad');
        var have = {}, add = 0;
        state.entries.forEach(function (e) { have[e.id] = 1; });
        o.entries.forEach(function (x) {
          if (validEntry(x) && !have[x.id]) {
            state.entries.push({ id: String(x.id), type: x.type, name: String(x.name || ''), amount: Number(x.amount), date: x.date, ts: x.ts || 0 });
            have[x.id] = 1; add++;
          }
        });
        if (!state.budget && Number(o.budget) > 0) state.budget = Number(o.budget);
        saveLocal(); render();
        toast(add ? bn(add) + ' টি হিসাব ঢুকানো হয়েছে' : 'নতুন কোনো হিসাব পাওয়া যায়নি');
      } catch (e) { toast('এটা হিসাবের খাতার ব্যাকআপ ফাইল নয়'); }
    };
    rd.readAsText(f);
    input.value = '';
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { if (!$('fDate').value || $('fDate').value > ymd(new Date())) $('fDate').value = ymd(new Date()); render(); }
  });

  /* ---------- start ---------- */
  $('fDate').value = ymd(new Date());
  loadLocal();
  renderForm(); render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
</body>
</html>
